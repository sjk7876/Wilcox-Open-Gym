<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wilcox Open Gym</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #282828;
  --accent: #d4f54e;
  --accent2: #ff5f3d;
  --text: #efefef;
  --muted: #666;
  --dim: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(212,245,78,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,245,78,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events:none;
  z-index:0;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; position: relative; z-index:1; }

/* HEADER */
header { padding: 44px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 36px; }
h1 {
  font-family: 'Black Han Sans', sans-serif;
  font-size: clamp(2.8rem, 7vw, 5rem);
  color: var(--accent);
  letter-spacing: -1px;
  line-height: 1;
  text-shadow: 3px 3px 0 rgba(212,245,78,0.12);
}
.header-sub {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-top: 8px;
}

/* TEAM COUNT */
.count-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.count-row select { flex: none; width: 70px; }
.count-row label { white-space: nowrap; }
.empty-note {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--muted);
}

/* SECTION LABELS */
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after { content:''; flex:1; height:1px; background: var(--border); }

/* TEAM COLOR SETUP */
.team-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 32px;
}
@media(max-width:600px){ .team-grid{ grid-template-columns:1fr 1fr; } }
.team-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.team-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  width: 28px;
  flex-shrink: 0;
}
.color-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
  transition: transform 0.15s;
}
select {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 6px 8px;
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text);
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
  appearance: none;
}
select:focus { border-color: var(--accent); }

/* ROUND 1 SETUP */
.courts-row {
  display: grid;
  grid-template-columns: repeat(var(--courts, 3), 1fr);
  gap: 12px;
  margin-bottom: 14px;
}
@media(max-width:580px){ .courts-row{ grid-template-columns:1fr; } }
.court-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.court-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.63rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 12px;
}
.vs-block { display: flex; flex-direction: column; gap: 6px; }
.team-pick-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 2px;
}
.vs-sep {
  text-align: center;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 0.75rem;
  color: var(--accent2);
  letter-spacing: 0.25em;
  padding: 2px 0;
}

/* WAITING */
.waiting-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.waiting-slots { display: flex; gap: 10px; flex-wrap: wrap; }
.wait-slot {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
}
.wait-dot { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.12); }

/* BUTTONS */
.action-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 44px;
}
.btn-gen {
  background: var(--accent);
  color: #000;
  border: none;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.05rem;
  letter-spacing: 0.05em;
  padding: 13px 36px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 0 24px rgba(212,245,78,0.18);
}
.btn-gen:hover { transform: translateY(-2px); box-shadow: 0 4px 32px rgba(212,245,78,0.32); }
.btn-gen:active { transform: translateY(0); }
.btn-reset {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-reset:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-new-week { border-color: rgba(255,95,61,0.4); color: var(--accent2); }
.btn-new-week:hover { border-color: var(--accent2); background: rgba(255,95,61,0.08); }
.error-msg {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent2);
  padding: 10px 0;
  display: none;
}

/* SCHEDULE OUTPUT */
#output { margin-bottom: 60px; }
.rounds-list { display: flex; flex-direction: column; gap: 14px; }

.round-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.3s ease forwards;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(8px); }
  to   { opacity:1; transform: translateY(0); }
}

.round-head {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.rnum {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 2rem;
  color: var(--accent);
  line-height: 1;
  min-width: 30px;
}
.rhead-meta { display: flex; flex-direction: column; gap: 2px; }
.rhead-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
}
.rhead-sitting {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--dim);
  letter-spacing: 0.05em;
}
.rhead-sitting span { color: var(--muted); }

.round-body {
  display: grid;
  grid-template-columns: repeat(var(--courts, 3), 1fr) 1px;
}
@media(max-width:640px){ .round-body{ grid-template-columns:1fr; } }

.match-cell {
  padding: 18px 20px;
  border-right: 1px solid var(--border);
  position: relative;
}
.match-cell:nth-child(3) { border-right: none; }
/* Court changeover: a team finishing elsewhere has to wait for this court's previous game */
.match-cell.court-wait {
  background: rgba(255,95,61,0.07);
  box-shadow: inset 3px 0 0 var(--accent2);
}
.wait-note {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  color: var(--accent2);
  margin-top: 10px;
  text-transform: capitalize;
}
.wait-note + .wait-note { margin-top: 4px; }
.divider-col { background: var(--border); width: 1px; display:none; }

.court-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--muted);
  margin-bottom: 12px;
}

.matchup {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.team-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 5px;
  background: var(--surface2);
  border: 1px solid var(--border);
  transition: border-color 0.15s;
}
.team-badge:hover { border-color: var(--dim); }
.tbdot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  flex-shrink:0;
}
.tbname {
  font-family: 'DM Mono', monospace;
  font-size: 0.82rem;
  color: var(--text);
  text-transform: capitalize;
}
.match-vs {
  text-align: center;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 0.65rem;
  color: var(--accent2);
  letter-spacing: 0.2em;
  padding: 1px 0;
}

/* WINNER SELECTOR in output */
.winner-row {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.win-btn {
  flex: 1;
  min-width: 60px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  text-transform: capitalize;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.win-btn:hover { border-color: var(--accent); color: var(--accent); }
.win-btn.selected {
  background: rgba(212,245,78,0.12);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

.sitting-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  background: #111;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.sitting-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--dim);
}
.sitting-team {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--dim);
  text-transform: capitalize;
}
.sitting-dot { width:8px; height:8px; border-radius:50%; opacity:0.4; }

/* Round action buttons (reroll, swap) */
.round-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.btn-reroll {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  padding: 5px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-reroll:hover { border-color: var(--muted); color: var(--text); }
.btn-swap {
  background: transparent;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  padding: 4px 9px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-swap:hover { border-color: var(--text); color: var(--text); }

footer {
  border-top: 1px solid var(--border);
  padding: 20px 0;
  margin-top: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--dim);
  text-align: center;
  letter-spacing: 0.08em;
}

/* FORCE MATCHUPS */
select.force-select { flex: none; width: 150px; }
.force-add-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.force-vs-sep {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 0.72rem;
  color: var(--accent2);
  letter-spacing: 0.2em;
}
.btn-add-force {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  padding: 6px 14px;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-add-force:hover { border-color: var(--accent); background: rgba(212,245,78,0.06); }
.force-add-err {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--accent2);
}
.force-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.force-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
}
.force-item.force-failed { border-color: var(--accent2); background: rgba(255,95,61,0.05); }
.force-item.force-ok { border-color: rgba(212,245,78,0.35); }
.force-team {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text);
  text-transform: capitalize;
}
.force-dot { width:10px; height:10px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.1); flex-shrink:0; }
.force-badge {
  font-family: 'DM Mono', monospace;
  font-size: 0.63rem;
  padding: 2px 7px;
  border-radius: 3px;
  margin-left: auto;
  flex-shrink: 0;
}
.force-badge-ok { color: var(--accent); border: 1px solid rgba(212,245,78,0.4); }
.force-badge-fail { color: var(--accent2); border: 1px solid var(--accent2); }
.force-badge-late { color: var(--accent2); border: 1px solid rgba(255,95,61,0.5); }
.force-note {
  flex-basis: 100%;
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: -2px;
}
.force-note.warn { color: var(--accent2); }
.btn-remove-force {
  background: none;
  border: none;
  color: var(--accent2);
  cursor: pointer;
  font-size: 1.15rem;
  padding: 4px 8px;
  line-height: 1;
  transition: color 0.15s;
  flex-shrink: 0;
  min-width: 32px;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-remove-force:hover { color: var(--accent2); }

/* ── MOBILE ── */
@media(max-width:640px) {
  /* Stacked match cells: switch from right-border to bottom-border separators */
  .match-cell { border-right: none; border-bottom: 1px solid var(--border); }
  .match-cell:last-child { border-bottom: none; }
}

@media(max-width:480px) {
  header { padding: 24px 0 18px; margin-bottom: 24px; }

  /* Prevent iOS auto-zoom on focus */
  select { font-size: 16px; }

  /* Step 1: tighter team rows */
  .team-row { padding: 7px 10px; gap: 7px; }
  .color-dot { width: 16px; height: 16px; }
  .team-num { width: 22px; font-size: 0.65rem; }

  /* Force add row: selects share a row, button drops full-width below */
  select.force-select { flex: 1; width: auto; }
  .btn-add-force { width: 100%; text-align: center; padding: 10px 14px; }

  /* Action bar: stack buttons full-width */
  .action-bar { flex-direction: column; align-items: stretch; }
  .btn-gen { text-align: center; padding: 14px; }
  .btn-reset { text-align: center; padding: 12px; }

  /* Win buttons: larger tap target */
  .win-btn { padding: 10px 8px; font-size: 0.75rem; min-height: 44px; }

  /* Round head: allow wrap so action buttons don't overflow */
  .round-head { flex-wrap: wrap; row-gap: 8px; }
  .round-actions { margin-left: 0; width: 100%; justify-content: flex-start; }
  .btn-reroll { padding: 10px 12px; }
  .btn-swap { padding: 10px 12px; }

  /* Force items: prevent long team names from overflowing */
  .force-team { min-width: 0; }

  /* Remove-force button: bigger tap target on touch screens */
  .btn-remove-force { min-width: 44px; min-height: 44px; padding: 8px; }

  /* Force badge: slightly larger text */
  .force-badge { font-size: 0.7rem; padding: 4px 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WILCOX OPEN GYM</h1>
    <div class="header-sub" id="header-sub"></div>
  </header>

  <!-- STEP 1: TEAM COLORS -->
  <div class="section-label">Step 1 — Assign Team Colors</div>
  <div class="count-row">
    <label for="num-teams">Teams playing:</label>
    <select id="num-teams" onchange="setNumTeams(parseInt(this.value))"></select>
  </div>
  <div class="count-row" id="priority-row">
    <label for="priority-team">Priority team:</label>
    <select id="priority-team" style="width:130px;" onchange="setPriorityTeam(this.value)"></select>
  </div>
  <div class="team-grid" id="team-grid"></div>

  <!-- STEP 2: ROUND 1 MATCHUPS -->
  <div class="section-label">Step 2 — Round 1 Matchups</div>
  <div class="courts-row" id="courts-row"></div>

  <!-- STEP 3: WAITING TEAMS -->
  <div class="section-label">Step 3 — Sitting Out (Round 1)</div>
  <div class="waiting-card">
    <div class="section-label" style="margin:0; flex-shrink:0; white-space:nowrap; border:none;">Sitting out:</div>
    <div class="waiting-slots" id="waiting-display"></div>
  </div>

  <!-- STEP 4: ROUND 2 BENCH ASSIGNMENT -->
  <div class="section-label">Step 4 — Round 2 Bench Assignment <span style="font-size:0.6em;color:var(--dim);margin-left:4px;">— who comes on per court</span></div>
  <div class="courts-row" id="r2bench-row" style="margin-bottom:32px;"></div>

  <!-- STEP 5: FORCE MATCHUPS -->
  <div class="section-label">Force Matchups <span style="font-size:0.6em;color:var(--dim);margin-left:4px;">— optional</span></div>
  <div style="margin-bottom:32px;">
    <div class="force-add-row">
      <select class="force-select" id="force-a"></select>
      <span class="force-vs-sep">VS</span>
      <select class="force-select" id="force-b"></select>
      <button class="btn-add-force" onclick="addForcedMatch()">+ Add</button>
      <span class="force-add-err" id="force-add-err"></span>
    </div>
    <div class="force-list" id="force-list"></div>
  </div>

  <!-- ACTION -->
  <div class="action-bar">
    <button class="btn-gen" onclick="generate()">⚡ Generate Schedule</button>
    <button class="btn-reset btn-new-week" onclick="startNewWeek()">↺ New Week</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- OUTPUT -->
  <div id="output"></div>

  <footer>wilcox.spencerkurtz.com &mdash; built for open gym</footer>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const COLORS = [
  { name:'red',       hex:'#e53935' },
  { name:'blue',      hex:'#1e88e5' },
  { name:'yellow',    hex:'#fdd835' },
  { name:'gray',      hex:'#757575' },
  { name:'white',     hex:'#eeeeee' },
  { name:'black',     hex:'#212121' },
  { name:'light blue',hex:'#4fc3f7' },
  { name:'green',     hex:'#43a047' },
  { name:'pink',      hex:'#e91e8c' },
  { name:'purple',    hex:'#8e24aa' },
  { name:'brown',     hex:'#795548' },
  { name:'orange',    hex:'#fb8c00' },
];

const MAX_TEAMS = 9;
const MIN_TEAMS = 4;
const MAX_COURTS = 3;

// Derived from the team count (see applyTeamCount): courts fill up to MAX_COURTS,
// whoever doesn't fit sits. 9 teams = 3 courts / 3 sitting, 8 = 3 / 2, 5 = 2 / 1, etc.
let NUM_TEAMS = 9;
let NUM_COURTS = 3;
let NUM_SITTING = 3;

function applyTeamCount(n) {
  NUM_TEAMS = n;
  NUM_COURTS = Math.min(MAX_COURTS, Math.floor(n / 2));
  NUM_SITTING = n - NUM_COURTS * 2;
  document.documentElement.style.setProperty('--courts', NUM_COURTS);
}

// Host / priority team (team number or null): sits as little as the 3-in-a-row cap allows.
// Only applies when fewer than MAX_TEAMS are playing and someone actually sits (not 6 or 4 teams).
let priorityTeam = null;
const PRIORITY_MAX_RUN = 3;
const priorityApplies = () => NUM_TEAMS < MAX_TEAMS && NUM_SITTING > 0;

const DEFAULT_COLORS = ['red','blue','yellow','gray','purple','black','light blue','green','pink'];
const defaultR1 = () => Array.from({length: NUM_COURTS}, (_, c) => [c*2+1, c*2+2]);
const defaultBench = () => Array.from({length: NUM_SITTING}, (_, i) => NUM_COURTS*2 + i + 1);

// team assignments: teamColors[i] = color name for team i+1 (always MAX_TEAMS long, first NUM_TEAMS used)
let teamColors = [...DEFAULT_COLORS];

// round 1 matchups: [[t1,t2],[t3,t4],[t5,t6]] (1-indexed team numbers), one per court
let r1matchups = defaultR1();
// waiting teams for round 1 (1-indexed)
let r1waiting = defaultBench();
// which waiter comes to each of the first NUM_SITTING courts in R2: r2benchOrder[courtIdx] = team number
let r2benchOrder = defaultBench();

const numRounds = 7;

// Generated schedule: array of round objects
// { matches: [{a, b, winner}], sitting: [t,...] }
let schedule = [];

// History of matchups played: Set of "min-max" strings
let playedMatchups = new Set();

// Forced matchup constraints
let forcedMatches = []; // [{ a: teamNum, b: teamNum }]
// 1-based round number when satisfied, null = pending, -1 = failed
let forcedMatchSatisfiedRound = [];

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
const SAVE_KEY = 'wilcox_state_v1';

function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      numTeams: NUM_TEAMS,
      priorityTeam,
      teamColors,
      r1matchups,
      r2benchOrder,
      forcedMatches,
      forcedMatchSatisfiedRound,
      schedule,
      playedMatchups: [...playedMatchups],
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.numTeams >= MIN_TEAMS && s.numTeams <= MAX_TEAMS) applyTeamCount(s.numTeams);
    if (s.priorityTeam >= 1 && s.priorityTeam <= NUM_TEAMS && priorityApplies()) priorityTeam = s.priorityTeam;
    if (s.teamColors?.length === MAX_TEAMS)      teamColors = s.teamColors;
    if (s.r1matchups?.length === NUM_COURTS)     r1matchups = s.r1matchups;
    if (s.r2benchOrder?.length === NUM_SITTING)  r2benchOrder = s.r2benchOrder;
    if (Array.isArray(s.forcedMatches))          forcedMatches = s.forcedMatches;
    if (Array.isArray(s.forcedMatchSatisfiedRound)) forcedMatchSatisfiedRound = s.forcedMatchSatisfiedRound;
    if (Array.isArray(s.schedule))               schedule = s.schedule;
    if (Array.isArray(s.playedMatchups))         playedMatchups = new Set(s.playedMatchups);
  } catch(e) {}
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.onload = () => {
  applyTeamCount(NUM_TEAMS);
  loadState();
  buildTeamCountSelect();
  buildPrioritySelect();
  buildTeamGrid();
  buildCourts();
  syncWaiting(); // also calls buildR2BenchUI
  buildForceSelects();
  renderSchedule();
  renderForcedList();
};

// ─── TEAM COUNT ───────────────────────────────────────────────────────────────
function buildTeamCountSelect() {
  const sel = document.getElementById('num-teams');
  sel.innerHTML = Array.from({length: MAX_TEAMS - MIN_TEAMS + 1}, (_, i) => MAX_TEAMS - i)
    .map(n => `<option value="${n}" ${n===NUM_TEAMS?'selected':''}>${n}</option>`).join('');
  const sit = NUM_SITTING === 0 ? 'everyone plays every round' : `${NUM_SITTING} sitting per round`;
  document.getElementById('header-sub').innerHTML =
    `Volleyball Schedule Generator &mdash; ${NUM_TEAMS} Teams · ${NUM_COURTS} Courts · ${sit}`;
}

function buildPrioritySelect() {
  const sel = document.getElementById('priority-team');
  document.getElementById('priority-row').style.display = priorityApplies() ? '' : 'none';
  sel.innerHTML = `<option value="">None</option>` + Array.from({length: NUM_TEAMS}, (_, i) => i + 1)
    .map(t => `<option value="${t}" ${t===priorityTeam?'selected':''}>${teamLabel(t)}</option>`).join('');
}

function setPriorityTeam(val) {
  priorityTeam = val ? parseInt(val) : null;
  saveState();
}

function setNumTeams(n) {
  if (n === NUM_TEAMS) return;
  if (schedule.length && !confirm('Change the team count? This clears Round 1 matchups, bench order, and the generated schedule.')) {
    document.getElementById('num-teams').value = NUM_TEAMS;
    return;
  }
  applyTeamCount(n);
  priorityTeam = null;
  r1matchups = defaultR1();
  r2benchOrder = defaultBench();
  forcedMatches = forcedMatches.filter(fm => fm.a <= n && fm.b <= n);
  forcedMatchSatisfiedRound = forcedMatches.map(() => null);
  schedule = [];
  playedMatchups = new Set();
  rebuildAll();
  saveState();
}

// Rebuild every setup widget from current state
function rebuildAll() {
  document.getElementById('output').innerHTML = '';
  document.getElementById('error-msg').style.display = 'none';
  buildTeamCountSelect();
  buildPrioritySelect();
  buildTeamGrid();
  buildCourts();
  syncWaiting(); // also calls buildR2BenchUI
  buildForceSelects();
  renderForcedList();
}

// ─── TEAM GRID ────────────────────────────────────────────────────────────────
function buildTeamGrid() {
  const grid = document.getElementById('team-grid');
  grid.innerHTML = '';
  for (let i = 0; i < NUM_TEAMS; i++) {
    const color = teamColors[i];
    const hex = colorHex(color);
    const row = document.createElement('div');
    row.className = 'team-row';
    row.innerHTML = `
      <span class="team-num">T${i+1}</span>
      <div class="color-dot" id="dot-${i}" style="background:${hex}"></div>
      <select onchange="setTeamColor(${i}, this.value)">
        ${COLORS.map(c=>`<option value="${c.name}" ${c.name===color?'selected':''}>${c.name}</option>`).join('')}
      </select>
    `;
    grid.appendChild(row);
  }
}

function setTeamColor(idx, color) {
  teamColors[idx] = color;
  document.getElementById(`dot-${idx}`).style.background = colorHex(color);
  syncWaiting(); // also calls buildR2BenchUI
  refreshCourts();
  refreshForceSelects();
  saveState();
}

function colorHex(name) {
  return (COLORS.find(c=>c.name===name)||{hex:'#555'}).hex;
}

function teamLabel(tnum) {
  return teamColors[tnum-1] || `Team ${tnum}`;
}

// ─── COURTS / R1 SETUP ───────────────────────────────────────────────────────
function buildCourts() {
  const row = document.getElementById('courts-row');
  row.innerHTML = '';
  for (let c = 0; c < NUM_COURTS; c++) {
    const [a, b] = r1matchups[c];
    const card = document.createElement('div');
    card.className = 'court-card';
    card.innerHTML = `
      <div class="court-tag">Court ${c+1}</div>
      <div class="vs-block">
        <div>
          <div class="team-pick-label">Home</div>
          <select id="r1-c${c}-a" onchange="updateR1(${c},'a',this.value)">
            ${teamOptions(a)}
          </select>
        </div>
        <div class="vs-sep">VS</div>
        <div>
          <div class="team-pick-label">Away</div>
          <select id="r1-c${c}-b" onchange="updateR1(${c},'b',this.value)">
            ${teamOptions(b)}
          </select>
        </div>
      </div>
    `;
    row.appendChild(card);
  }
}

function teamOptions(selected) {
  return Array.from({length:NUM_TEAMS},(_,i)=>i+1)
    .map(t=>`<option value="${t}" ${t===selected?'selected':''}>${teamLabel(t)}</option>`)
    .join('');
}

function refreshCourts() {
  for (let c = 0; c < NUM_COURTS; c++) {
    ['a','b'].forEach(side => {
      const sel = document.getElementById(`r1-c${c}-${side}`);
      if (!sel) return;
      const cur = parseInt(sel.value);
      sel.innerHTML = teamOptions(cur);
    });
  }
  syncWaiting();
}

function updateR1(court, side, val) {
  if (side==='a') r1matchups[court][0] = parseInt(val);
  else r1matchups[court][1] = parseInt(val);
  syncWaiting();
  saveState();
}

function syncWaiting() {
  const playing = new Set(r1matchups.flat());
  r1waiting = [];
  for (let t=1; t<=NUM_TEAMS; t++) {
    if (!playing.has(t)) r1waiting.push(t);
  }
  renderForcedList();

  // Re-sync r2benchOrder: keep valid assignments, replace any that are no longer waiting
  const validSet = new Set(r1waiting);
  const used = new Set();
  const newOrder = [];
  for (let c = 0; c < NUM_SITTING; c++) {
    const cur = r2benchOrder[c];
    if (validSet.has(cur) && !used.has(cur)) {
      newOrder.push(cur);
      used.add(cur);
    } else {
      newOrder.push(null);
    }
  }
  const remaining = r1waiting.filter(t => !used.has(t));
  let ri = 0;
  for (let c = 0; c < NUM_SITTING; c++) {
    if (newOrder[c] === null) newOrder[c] = remaining[ri++];
  }
  r2benchOrder = newOrder;

  const disp = document.getElementById('waiting-display');
  disp.innerHTML = r1waiting.length === 0
    ? '<span class="empty-note">Nobody — every team is on a court.</span>'
    : r1waiting.map(t => `
    <div class="wait-slot">
      <div class="wait-dot" style="background:${colorHex(teamColors[t-1])}"></div>
      <span style="font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--muted);text-transform:capitalize;">${teamLabel(t)}</span>
    </div>
  `).join('');

  buildR2BenchUI();
}

// ─── R2 BENCH ASSIGNMENT ──────────────────────────────────────────────────────
function buildR2BenchUI() {
  const row = document.getElementById('r2bench-row');
  if (!row) return;
  row.innerHTML = '';
  if (NUM_SITTING === 0) {
    row.innerHTML = '<div class="empty-note">Everyone plays every round — no bench to assign.</div>';
    return;
  }
  for (let c = 0; c < NUM_SITTING; c++) {
    const card = document.createElement('div');
    card.className = 'court-card';
    card.innerHTML = `
      <div class="court-tag">Court ${c+1}</div>
      <div class="vs-block">
        <div class="team-pick-label">Comes on</div>
        <select id="r2bench-${c}" onchange="updateR2Bench(${c}, this.value)">
          ${r2benchOptions(r2benchOrder[c])}
        </select>
      </div>
    `;
    row.appendChild(card);
  }
}

function r2benchOptions(selected) {
  return r1waiting.map(t =>
    `<option value="${t}" ${t===selected?'selected':''}>${teamLabel(t)}</option>`
  ).join('');
}

function updateR2Bench(courtIdx, val) {
  const newTeam = parseInt(val);
  const oldTeam = r2benchOrder[courtIdx];
  const conflictIdx = r2benchOrder.indexOf(newTeam);
  if (conflictIdx !== -1 && conflictIdx !== courtIdx) {
    r2benchOrder[conflictIdx] = oldTeam; // swap
  }
  r2benchOrder[courtIdx] = newTeam;
  buildR2BenchUI();
  saveState();
}

// ─── FORCE MATCHUPS ───────────────────────────────────────────────────────────
function buildForceSelects() {
  const selA = document.getElementById('force-a');
  const selB = document.getElementById('force-b');
  selA.innerHTML = forceTeamOptions(1);
  selB.innerHTML = forceTeamOptions(2);
}

function forceTeamOptions(selected) {
  return Array.from({length: NUM_TEAMS}, (_, i) => i+1)
    .map(t => `<option value="${t}" ${t===selected?'selected':''}>${teamLabel(t)}</option>`)
    .join('');
}

function refreshForceSelects() {
  buildPrioritySelect(); // team labels changed
  ['force-a', 'force-b'].forEach(id => {
    const sel = document.getElementById(id);
    const cur = parseInt(sel.value) || 1;
    sel.innerHTML = forceTeamOptions(cur);
  });
  renderForcedList();
}

function addForcedMatch() {
  const errEl = document.getElementById('force-add-err');
  const a = parseInt(document.getElementById('force-a').value);
  const b = parseInt(document.getElementById('force-b').value);

  if (a === b) { errEl.textContent = 'A team cannot play itself.'; return; }
  if (forcedMatches.some(fm => matchKey(fm.a, fm.b) === matchKey(a, b))) {
    errEl.textContent = 'That matchup is already in the list.'; return;
  }
  errEl.textContent = '';
  forcedMatches.push({ a, b });
  forcedMatchSatisfiedRound.push(null);
  renderForcedList();
  saveState();
}

function removeForcedMatch(idx) {
  forcedMatches.splice(idx, 1);
  forcedMatchSatisfiedRound.splice(idx, 1);
  renderForcedList();
  saveState();
}

// 9 teams rotate in three lockstep groups: Round 1 bench, Round 1 winners, Round 1 losers.
// Two teams in the same group are always fresh (or on their second game) at the same time,
// so playing each other after Round 2 forces one of them to change courts.
// Returns 'yes', 'maybe' (both on Round 1 courts, results not in yet), or null.
function sameRotation(a, b) {
  if (NUM_TEAMS !== MAX_TEAMS) return null;
  if (r1matchups.some(([x, y]) => matchKey(x, y) === matchKey(a, b))) return null;
  const benchA = r1waiting.includes(a), benchB = r1waiting.includes(b);
  if (benchA || benchB) return benchA && benchB ? 'yes' : null;
  const r1 = schedule[0];
  if (!r1 || r1.matches.some(m => m.winner === null)) return 'maybe';
  const won = t => r1.matches.some(m => m.winner === t);
  return won(a) === won(b) ? 'yes' : null;
}

function renderForcedList() {
  const list = document.getElementById('force-list');
  if (!forcedMatches.length) { list.innerHTML = ''; return; }
  list.innerHTML = forcedMatches.map(({ a, b }, i) => {
    const v = forcedMatchSatisfiedRound[i];
    const isFailed = v === -1;
    const isSatisfied = v !== null && v > 0;
    const cls = isFailed ? 'force-failed' : isSatisfied ? 'force-ok' : '';
    const isLate = isSatisfied && v === numRounds;
    const badge = isFailed
      ? `<span class="force-badge force-badge-fail">✗ failed</span>`
      : isLate
        ? `<span class="force-badge force-badge-late">R${v}</span>`
        : isSatisfied
          ? `<span class="force-badge force-badge-ok">✓ R${v}</span>`
          : '';
    const rot = isSatisfied && v <= 2 ? null : sameRotation(a, b);
    const note = isLate
      ? `<div class="force-note warn">Only fits in the last round${rot === 'yes' ? ' (same rotation group)' : ''} — might not get played</div>`
      : rot === 'yes'
        ? `<div class="force-note warn">⚠ Same rotation group — one team will have to change courts. Play them in Round 1${r1waiting.includes(a) && r1waiting.includes(b) ? ' or move one off the bench' : ''}.</div>`
        : rot === 'maybe'
          ? `<div class="force-note">Same rotation group if both win or both lose Round 1 — play them in Round 1 or bench one to be safe.</div>`
          : '';
    return `
      <div class="force-item ${cls}">
        <div class="force-team">
          <div class="force-dot" style="background:${colorHex(teamColors[a-1])}"></div>
          ${teamLabel(a)}
        </div>
        <span class="force-vs-sep" style="font-size:0.6rem;">VS</span>
        <div class="force-team">
          <div class="force-dot" style="background:${colorHex(teamColors[b-1])}"></div>
          ${teamLabel(b)}
        </div>
        ${badge}
        <button class="btn-remove-force" onclick="removeForcedMatch(${i})" title="Remove">×</button>
        ${note}
      </div>
    `;
  }).join('');
}

// ─── VALIDATION ──────────────────────────────────────────────────────────────
function validate() {
  const err = document.getElementById('error-msg');
  // Check no duplicate teams in r1
  const playing = r1matchups.flat();
  const unique = new Set(playing);
  if (unique.size !== playing.length) {
    err.style.display='block';
    err.textContent = 'Error: A team appears more than once in Round 1 matchups.';
    return false;
  }
  // Check no same team vs itself
  for (let m of r1matchups) {
    if (m[0]===m[1]) {
      err.style.display='block';
      err.textContent = 'Error: A team cannot play itself.';
      return false;
    }
  }
  if (priorityTeam && priorityApplies() && !playing.includes(priorityTeam)) {
    err.style.display='block';
    err.textContent = 'Error: The priority team has to play in Round 1 — put them on a court instead of the bench.';
    return false;
  }
  err.style.display='none';
  return true;
}

// ─── SCHEDULE GENERATION ──────────────────────────────────────────────────────
function matchKey(a, b) {
  return `${Math.min(a,b)}-${Math.max(a,b)}`;
}

function permutations(arr) {
  if (arr.length<=1) return [arr];
  const result=[];
  for(let i=0;i<arr.length;i++){
    const rest=arr.filter((_,j)=>j!==i);
    permutations(rest).forEach(p=>result.push([arr[i],...p]));
  }
  return result;
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function generate() {
  if (!validate()) return;

  forcedMatchSatisfiedRound = forcedMatches.map(() => null);
  document.getElementById('error-msg').style.display = 'none';

  schedule = [];
  playedMatchups = new Set();

  const r1matches = r1matchups.map(([a,b]) => {
    playedMatchups.add(matchKey(a,b));
    return {a, b, winner: null};
  });

  schedule.push({ matches: r1matches, sitting: [...r1waiting] });

  // Check if any forced match is already in R1
  forcedMatches.forEach(({ a, b }, i) => {
    r1matchups.forEach(([ra, rb]) => {
      if ((ra===a && rb===b) || (ra===b && rb===a)) {
        forcedMatchSatisfiedRound[i] = 1;
      }
    });
  });

  renderSchedule();
  renderForcedList();
  saveState();
}

function onWinnerSelected(roundIdx, courtIdx, winner) {
  schedule = schedule.slice(0, roundIdx + 1);
  rebuildPlayedMatchups(roundIdx);
  // Reset forced match satisfaction for rounds after the current one
  forcedMatchSatisfiedRound = forcedMatchSatisfiedRound.map(v =>
    (v !== null && v > 0 && v <= roundIdx + 1) ? v : null
  );

  schedule[roundIdx].matches[courtIdx].winner = winner;

  const rnd = schedule[roundIdx];
  if (rnd.matches.some(m => m.winner === null)) {
    renderSchedule();
    renderForcedList();
    return;
  }

  cascadeFrom(roundIdx);

  // Check for forced matches that couldn't be satisfied
  const failedIndices = forcedMatches
    .map((_, i) => i)
    .filter(i => forcedMatchSatisfiedRound[i] === null);

  if (failedIndices.length > 0) {
    failedIndices.forEach(i => { forcedMatchSatisfiedRound[i] = -1; });
    schedule = [];
    const err = document.getElementById('error-msg');
    err.style.display = 'block';
    err.textContent = `Could not schedule: ${failedIndices.map(i =>
      `${teamLabel(forcedMatches[i].a)} vs ${teamLabel(forcedMatches[i].b)}`
    ).join(' · ')}`;
  }

  renderSchedule();
  renderForcedList();
  saveState();
}

// Pairing costs (lower is better): a team on its second game in a row changing courts,
// a court wait, a rematch; forced matchups are a bonus.
// A forced matchup in the last round costs lastRoundForced — nights usually stop after 6.
const COST = { move: 10, wait: 100, rematch: 1000, forced: 5000, lastRoundForced: 100000 };

// Generate every round after `roundIdx` several times and keep the best schedule:
// fewest unmet forced matchups, then forced matchups in the last round, then rematches,
// then court waits. Retries sometimes
// hold a forced matchup back so it can land in a round where it doesn't cause a wait.
const CASCADE_TRIES = 40;
let forcedDeferChance = 0;

function cascadeFrom(roundIdx) {
  const keepRounds = schedule.slice(0, roundIdx + 1);
  const keepForced = [...forcedMatchSatisfiedRound];
  let best = null;
  for (let k = 0; k < CASCADE_TRIES; k++) {
    schedule = [...keepRounds];
    forcedMatchSatisfiedRound = [...keepForced];
    rebuildPlayedMatchups(roundIdx);
    forcedDeferChance = k === 0 ? 0 : 0.5;
    for (let i = roundIdx; i < numRounds - 1; i++) computeNextRound(i);
    const cost = scheduleCost(roundIdx);
    if (!best || cost < best.cost) best = { cost, schedule, forced: forcedMatchSatisfiedRound };
    if (cost === 0) break;
  }
  forcedDeferChance = 0;
  schedule = best.schedule;
  forcedMatchSatisfiedRound = best.forced;
  rebuildPlayedMatchups(schedule.length - 1);
}

// Teams that played the round before on a different court than this one, summed over later rounds
function courtMoves(fromRound) {
  let moves = 0;
  for (let ri = fromRound + 1; ri < schedule.length; ri++) {
    schedule[ri].matches.forEach((m, ci) => [m.a, m.b].forEach(t => {
      const prevCi = schedule[ri-1].matches.findIndex(pm => pm.a === t || pm.b === t);
      if (prevCi !== -1 && prevCi !== ci) moves++;
    }));
  }
  return moves;
}

function scheduleCost(fromRound) {
  const unmet = forcedMatchSatisfiedRound.filter(v => v === null).length;
  const seen = new Set();
  let rematches = 0, waits = 0;
  schedule.forEach((rnd, ri) => rnd.matches.forEach((m, ci) => {
    const key = matchKey(m.a, m.b);
    if (seen.has(key)) rematches++;
    seen.add(key);
    if (ri > fromRound && courtWaitFor(ri, ci)) waits++;
  }));
  const lastRound = forcedMatchSatisfiedRound.filter(v => v === numRounds).length;
  return unmet * 1e6 + lastRound * COST.lastRoundForced + rematches * COST.rematch + waits * COST.wait + courtMoves(fromRound) * COST.move;
}

function rebuildPlayedMatchups(upToRound) {
  playedMatchups = new Set();
  for (let i = 0; i <= upToRound && i < schedule.length; i++) {
    schedule[i].matches.forEach(m => playedMatchups.add(matchKey(m.a, m.b)));
  }
}

function computeNextRound(roundIdx) {
  if (roundIdx + 1 >= numRounds) return;
  // The 9-team logic below is the original; fewer teams use the generalized version.
  if (NUM_TEAMS !== MAX_TEAMS) return computeNextRoundFewerTeams(roundIdx);

  const rnd = schedule[roundIdx];
  const sitting = rnd.sitting;

  let nextSitting, stayGroup, comeOnGroup;

  if (roundIdx === 0) {
    // R1 → R2: winners stay on their court, r2benchOrder assigns one waiter per court
    const winners = rnd.matches.map(m => m.winner);
    if (winners.some(w => w === null)) return; // not all R1 winners set yet
    const losers  = rnd.matches.map(m => m.a === m.winner ? m.b : m.a);
    // Pair court-by-court: winners[i] (Court i+1) vs r2benchOrder[i]
    const allPairs = winners.map((w, i) => [w, r2benchOrder[i]]);
    // Check forced matches satisfied by R2 assignment
    forcedMatches.forEach(({ a, b }, i) => {
      if (forcedMatchSatisfiedRound[i] !== null) return;
      if (allPairs.some(([pa, pb]) => matchKey(pa, pb) === matchKey(a, b))) {
        forcedMatchSatisfiedRound[i] = 2;
      }
    });
    schedule[roundIdx + 1] = buildRoundFromPairs(allPairs, losers);
    return;
  } else {
    // R2+ → fully mechanical, wins don't matter
    // Look at who played THIS round vs who played LAST round:
    // - played both this round AND last round = 2 consecutive → sit next
    // - played this round but sat last round = 1 consecutive → stay
    // - sat this round → come on next
    const prevSittingSet = new Set(schedule[roundIdx - 1].sitting);
    const playingNow = rnd.matches.flatMap(m => [m.a, m.b]);

    const playedTwoInARow = playingNow.filter(t => !prevSittingSet.has(t));
    const playedOneInARow = playingNow.filter(t =>  prevSittingSet.has(t));

    nextSitting = playedTwoInARow;
    stayGroup   = playedOneInARow;
    comeOnGroup = [...sitting];
  }

  // Two stayers coming off different courts can't both keep their court — leave that
  // forced matchup for a later round when one of them comes on
  const forcedOk = (a, b) => !(stayGroup.includes(a) && stayGroup.includes(b));
  const slots = bestCourtAssignment(roundIdx, [...stayGroup, ...comeOnGroup], stayGroup, forcedOk);
  schedule[roundIdx + 1] = buildRoundFromPairs(slots, nextSitting);
}

// ─── SCHEDULING FOR FEWER THAN 9 TEAMS ───────────────────────────────────────
// Same ideas as the 9-team logic, but the sitting group is no longer exactly a third
// of the field, so who sits is picked by longest streak instead of "played twice".
function allMatchings(arr) {
  if (!arr.length) return [[]];
  const [first, ...rest] = arr;
  const out = [];
  rest.forEach((partner, i) => {
    const others = rest.filter((_, j) => j !== i);
    allMatchings(others).forEach(m => out.push([[first, partner], ...m]));
  });
  return out;
}

function computeNextRoundFewerTeams(roundIdx) {
  const rnd = schedule[roundIdx];

  if (roundIdx === 0) {
    // R1 → R2: winners on the first NUM_SITTING courts face the user-assigned waiters.
    // Remaining courts' winners face a loser from a different court; leftover losers sit.
    const winners = rnd.matches.map(m => m.winner);
    if (winners.some(w => w === null)) return;
    const losers = rnd.matches.map(m => m.a === m.winner ? m.b : m.a);

    const pairs = [];
    for (let c = 0; c < NUM_SITTING; c++) pairs.push([winners[c], r2benchOrder[c]]);
    let nextSitting = [];
    const extra = NUM_COURTS - NUM_SITTING;
    if (extra > 0) {
      // Never pair a winner with the loser from their own court; keep the priority team off the bench if possible
      const valid = shuffle(permutations(losers)).filter(p =>
        p.slice(0, extra).every((l, j) => l !== losers[NUM_SITTING + j]));
      const perm = valid.find(p => !p.slice(extra).includes(priorityTeam)) || valid[0];
      for (let j = 0; j < extra; j++) pairs.push([winners[NUM_SITTING + j], perm[j]]);
      nextSitting = perm.slice(extra);
    }

    forcedMatches.forEach(({ a, b }, i) => {
      if (forcedMatchSatisfiedRound[i] !== null) return;
      if (pairs.some(([pa, pb]) => matchKey(pa, pb) === matchKey(a, b))) forcedMatchSatisfiedRound[i] = 2;
    });
    schedule[roundIdx + 1] = buildRoundFromPairs(pairs, nextSitting);
    return;
  }

  // R2+: sit whoever has played the most rounds in a row (ties → most games, then random)
  const playingNow = rnd.matches.flatMap(m => [m.a, m.b]);
  const played = (t, r) => schedule[r].matches.some(m => m.a === t || m.b === t);
  const streak = t => { let n = 0; for (let r = roundIdx; r >= 0 && played(t, r); r--) n++; return n; };
  const games  = t => schedule.slice(0, roundIdx + 1).filter((_, r) => played(t, r)).length;
  // Priority team is the last pick to sit until it hits the run cap
  const shielded = t => t === priorityTeam && streak(t) < PRIORITY_MAX_RUN ? 1 : 0;
  const nextSitting = shuffle(playingNow)
    .sort((x, y) => shielded(x) - shielded(y) || streak(y) - streak(x) || games(y) - games(x))
    .slice(0, NUM_SITTING);

  const stayGroup = playingNow.filter(t => !nextSitting.includes(t));
  const slots = bestCourtAssignment(roundIdx, [...stayGroup, ...rnd.sitting], stayGroup);
  schedule[roundIdx + 1] = buildRoundFromPairs(slots, nextSitting);
}

// Score every pairing of `available` and every way of putting the pairs on courts:
// rematches hurt most, forced matchups help, then court waits, then staying teams
// changing courts. Marks any forced matchups it satisfies. `forcedOk(a, b)` can
// withhold a forced matchup's bonus this round (so can forcedDeferChance on retries).
function bestCourtAssignment(roundIdx, available, stayGroup, forcedOk = () => true) {
  const rnd = schedule[roundIdx];
  const prevCourtOf = {};
  rnd.matches.forEach((m, ci) => { prevCourtOf[m.a] = ci; prevCourtOf[m.b] = ci; });
  const pending = forcedMatches.filter((f, i) => forcedMatchSatisfiedRound[i] === null && forcedOk(f.a, f.b) && Math.random() >= forcedDeferChance);
  const courtOrders = permutations(Array.from({length: NUM_COURTS}, (_, c) => c));

  let best = null;
  for (const matching of allMatchings(available)) {
    const rematches = matching.filter(([a, b]) => playedMatchups.has(matchKey(a, b))).length;
    const forcedHits = pending.filter(f => matching.some(([a, b]) => matchKey(a, b) === matchKey(f.a, f.b))).length;
    for (const order of courtOrders) {
      let moves = 0, waits = 0;
      matching.forEach((pair, i) => {
        if (isCourtWait(rnd, rnd.matches[order[i]], pair)) waits++;
        pair.forEach(t => { if (stayGroup.includes(t) && prevCourtOf[t] !== order[i]) moves++; });
      });
      const score = rematches * COST.rematch - forcedHits * COST.forced + waits * COST.wait + moves * COST.move + Math.random();
      if (!best || score < best.score) best = { score, matching, order };
    }
  }

  const slots = new Array(NUM_COURTS);
  best.matching.forEach((pair, i) => { slots[best.order[i]] = pair; });
  forcedMatches.forEach(({ a, b }, i) => {
    if (forcedMatchSatisfiedRound[i] !== null) return;
    if (slots.some(([x, y]) => matchKey(x, y) === matchKey(a, b))) forcedMatchSatisfiedRound[i] = roundIdx + 2;
  });
  return slots;
}

function buildRoundFromPairs(pairs, sitting) {
  const matches = pairs.map(([a, b]) => {
    playedMatchups.add(matchKey(a, b));
    return {a, b, winner: null};
  });
  return { matches, sitting };
}

function rerollRound(roundIdx) {
  if (roundIdx === 0) return;
  schedule = schedule.slice(0, roundIdx);
  rebuildPlayedMatchups(roundIdx - 1);
  forcedMatchSatisfiedRound = forcedMatchSatisfiedRound.map(v =>
    (v !== null && v > 0 && v <= roundIdx) ? v : null
  );
  computeNextRound(roundIdx - 1);
  renderSchedule();
  renderForcedList();
  saveState();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
// True if `pair`, playing where `prevMatch` was, has to wait for that game to finish:
// no team stays on the court, and at least one team is coming off a different court
// (teams coming off the bench are waiting anyway).
function isCourtWait(prevRnd, prevMatch, pair) {
  if (!prevMatch) return false;
  if (pair.some(t => t === prevMatch.a || t === prevMatch.b)) return false;
  return pair.some(t => prevRnd.matches.some(m => m.a === t || m.b === t));
}

// Teams in this round's match on court `ci` that played last round on a different court
function courtArrivals(ri, ci) {
  if (ri === 0) return [];
  const m = schedule[ri].matches[ci];
  return [m.a, m.b].flatMap(t => {
    const from = schedule[ri-1].matches.findIndex(pm => pm.a === t || pm.b === t);
    return from !== -1 && from !== ci ? [{ team: t, from }] : [];
  });
}

// The previous round's match on this court if this round's match has to wait for it
function courtWaitFor(ri, ci) {
  if (ri === 0) return null;
  const prev = schedule[ri-1].matches[ci];
  const m = schedule[ri].matches[ci];
  return isCourtWait(schedule[ri-1], prev, [m.a, m.b]) ? prev : null;
}

function renderSchedule() {
  const out = document.getElementById('output');
  if (!schedule.length) { out.innerHTML=''; return; }

  const html = schedule.slice(0, numRounds).map((rnd, ri) => {
    const delay = ri * 60;
    const allWon = rnd.matches.every(m=>m.winner!==null);
    const matchCells = rnd.matches.map((m, ci) => {
      const wait = courtWaitFor(ri, ci);
      const arrivals = courtArrivals(ri, ci);
      return `
      <div class="match-cell ${wait ? 'court-wait' : ''}">
        <div class="court-label">Court ${ci+1}</div>
        <div class="matchup">
          <div class="team-badge">
            <div class="tbdot" style="background:${colorHex(teamColors[m.a-1])}"></div>
            <span class="tbname">${teamLabel(m.a)}</span>
          </div>
          <div class="match-vs">VS</div>
          <div class="team-badge">
            <div class="tbdot" style="background:${colorHex(teamColors[m.b-1])}"></div>
            <span class="tbname">${teamLabel(m.b)}</span>
          </div>
        </div>
        <div class="winner-row">
          ${ri === 0 ? `
          <button class="win-btn ${m.winner===m.a?'selected':''}" onclick="onWinnerSelected(${ri},${ci},${m.a})">
            ${teamLabel(m.a)} ✓
          </button>
          <button class="win-btn ${m.winner===m.b?'selected':''}" onclick="onWinnerSelected(${ri},${ci},${m.b})">
            ${teamLabel(m.b)} ✓
          </button>
          ` : ''}
        </div>
        ${arrivals.map(({ team, from }) => `<div class="wait-note">↪ ${teamLabel(team)} moves from Court ${from+1}</div>`).join('')}
        ${wait ? `<div class="wait-note">⏳ Waits for ${teamLabel(wait.a)} vs ${teamLabel(wait.b)}</div>` : ''}
      </div>
    `;
    }).join('');

    const sittingDots = rnd.sitting.map(t=>`
      <div class="sitting-team">
        <div class="sitting-dot" style="background:${colorHex(teamColors[t-1])}"></div>
        ${teamLabel(t)}
      </div>
    `).join('');

    const rerollBtn = ri > 0 && ri === schedule.length-1
      ? `<button class="btn-reroll" onclick="rerollRound(${ri})" title="Re-roll this round's pairings">↻ reroll</button>`
      : '';

    const swapBtns = Array.from({length: NUM_COURTS - 1}, (_, c) => `
      <button class="btn-swap" onclick="swapCourts(${ri},${c},${c+1})" title="Swap courts ${c+1} and ${c+2}">${c+1}↔${c+2}</button>
    `).join('');

    return `
      <div class="round-block" style="animation-delay:${delay}ms">
        <div class="round-head">
          <div class="rnum">${ri+1}</div>
          <div class="rhead-meta">
            <div class="rhead-title">Round ${ri+1}</div>
            <div class="rhead-sitting"><span>Sitting:</span> ${rnd.sitting.length ? rnd.sitting.map(t=>teamLabel(t)).join(', ') : '—'}</div>
          </div>
          <div class="round-actions">${swapBtns}${rerollBtn}</div>
        </div>
        <div class="round-body">
          ${matchCells}
        </div>
      </div>
    `;
  }).join('');

  out.innerHTML = `<div class="rounds-list">${html}</div>`;
}

function swapCourts(roundIdx, courtA, courtB) {
  const matches = schedule[roundIdx].matches;
  [matches[courtA], matches[courtB]] = [matches[courtB], matches[courtA]];

  // Re-cascade everything downstream
  schedule = schedule.slice(0, roundIdx + 1);
  rebuildPlayedMatchups(roundIdx);
  forcedMatchSatisfiedRound = forcedMatchSatisfiedRound.map((v) =>
    (v !== null && v > 0 && v > roundIdx + 1) ? null : v
  );
  cascadeFrom(roundIdx);
  renderSchedule();
  renderForcedList();
  saveState();
}

function startNewWeek() {
  if (!confirm('Start a new week? This wipes team count, priority team, team colors, Round 1 matchups, bench order, forced matches, and the generated schedule.')) return;

  applyTeamCount(MAX_TEAMS);
  priorityTeam = null;
  teamColors = [...DEFAULT_COLORS];
  r1matchups = defaultR1();
  r2benchOrder = defaultBench();
  schedule = [];
  playedMatchups = new Set();
  forcedMatches = [];
  forcedMatchSatisfiedRound = [];

  rebuildAll();
  saveState();
}
</script>
